<div class="modal fade" id="LineamientoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title fw-bold py-2" id="exampleModalLabel1"> <span class="text-muted fw-light"></span>
          Creación de Lineamientos del PRE-POA</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
  
      <form id="formLineamineto" method="POST" onsubmit="return false">

        <div class="modal-body">
          <input type="hidden" id="created" name="id_lineamiento" />
        
          <div class="row">
            <span class="text-danger fw-light mb-3">Campos Obligatorio(*)</span>
              <div class="divider text-start-center">
                <div class="divider-text">Periodo del <b>Pre-POA</b></div>
              </div>
              <div class="row">

<!-- CAMPOS DEL LINEAMIENTO -->

                <div class="col-12 col-md-4 mb-2">
                  <div class="form-group">
                    <label for="fecha de Inicio" class="form-label">Fecha de Inicio</label>
                    <input class="form-control" type="date" name="fecha_inicio" id="fecha_inicio" />
                  </div>
                </div>
               <div class="col-12 col-md-4 mb-2">
                  <div class="form-group">
                    <label for="fecha de Cierre" class="form-label">Fecha de Cierre</label>
                    <input class="form-control" type="date" id="fecha_cierre" name="fecha_cierre" />
                  </div>
                </div>
                 <div class="col-12 col-md-4 mb-2">
                  <div class="form-group">
                    <label for="anno" class="form-label">Año</label>
                    <input class="form-control" type="text" name="anno" id="anno" readonly />
                  </div>
                </div>
              </div>
              <div class="divider text-start-center">
                <div class="divider-text">Datos de los Lineamientos</div>
              </div>
              
              <div class="row">
                <div class="col-12 col-md-6 mb-2">
                  <div class="form-group">
                    <label for="direccion" class="form-label">Normas Legales</label>
                    <textarea class="form-control" id="normas_legales" name="normas_legales" rows="4"
                      placeholder="Indique las Normas..." autofocus></textarea>
                  </div>
                </div>

                <div class="col-12 col-md-6 mb-2">
                  <div class="form-group">
                    <label for="direccion" class="form-label">Enfoque Estrategico</label>
                    <textarea class="form-control" id="enfoque_estrategico" name="enfoque_estrategico" rows="4"
                      placeholder="Indique la Estrategia..."></textarea>
                  </div>
                </div>
              </div>

              <div class="row">
              
                <div class="col-12 col-md-12 mb-2">
                  <div class="form-group">
                    <label for="alinear" class="form-label"><b>Lineamientos</b></label>
                    <textarea class="form-control" id="lineamientos" name="lineamientos" rows="4"
                      placeholder="Indique los Lineamientos..."></textarea>
                  </div>
                </div>
              </div>
            
            <div class="row">
              
                <div class="col-12 col-md-12 mb-2">
                  <div class="form-group">
                    <label for="metas_alcanzar" class="form-label"><b>Meta por Alcanzar</b></label>
                    <textarea class="form-control" id="metas_alcanzar" name="metas_alcanzar" rows="2"
                      placeholder="Indique la meta a alcanzar..."></textarea>
                  </div>
                </div>
              </div>   
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" id="Crear" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">
            Cerrar
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

<h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Consulta de</span> Lineamiento</h4>
