<div class="modal fade" id="DepartamentoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title fw-bold py-2" id="exampleModalLabel1"> <span class="text-muted fw-light"></span>
          Creación de Departamento</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="formDepartamento" method="POST" >

        <div class="modal-body">


          <div class="row">
            <span class="text-danger fw-light mb-3">Campos Obligatorio(*)</span>

            <div class="col-12 col-md-6 mb-2">

              <input type="hidden" name="created" id="created"/>
              

              <div class="row">
                <div class="col-12 col-md-6 mb-2">
                  <div class="form-group">
                    <label for="cedula" class="form-label">*Codigo</label>
                    <input class="form-control" type="text" name="codigo" id="codigo" placeholder="EFPOPE"
                      autofocus />
                  </div>
                </div>
                <div class="col-12 col-md-6 mb-2">
                  <div class="form-group">
                    <label for="firstName" class="form-label">*Nombre</label>
                    <input class="form-control" type="text" id="nombre" name="nombre" placeholder="Oficina de Planificación Estratégica" autofocus />
                  </div>
                </div>
              </div>


              <div class="row">
                <div class="col-12 col-md-6 mb-2">
                  <div class="form-group">
                    <label for="fechan" class="form-label">*Ubicación</label>
                    <input type="text" class="form-control" id="ubicacion" name="ubicacion" placeholder="Maracay-Sede-Central" />
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-md-6 mb-2">
              <div class="row">
                <div class="col-12 col-md-12 mb-2">
                  <div class="form-group">
                    <label for="direccion" class="form-label">*Descripción</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" rows="5"
                      placeholder="Indique la descrición del departamento"></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" id="Crear" class="btn btn-primary">Enviar</button>
          <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">
            Cerrar
          </button>
        </div>
        
      </form>
    </div>
  </div>
</div>

<h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Consulta de</span> Departamentos</h4>
