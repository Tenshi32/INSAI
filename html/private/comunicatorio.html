<div class="modal fade" id="basicModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title fw-bold py-2" id="exampleModalLabel1"> <span class="text-muted fw-light"></span>
          Creación de Comunicatorio</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="formUsuario" method="POST" onsubmit="return false">

        <div class="modal-body">

          <div class="row">
            <span class="text-danger fw-light mb-3">Campos Obligatorio(*)</span>

            <div class="col-12 col-md-5 mb-2">

              <div class="row">
                <div class="col-12 col-md-12 mb-2">
                  <div class="form-group">
                    <label class="form-label" for="country">*Tipo</label>
                    <select id="estado" class="select2 form-select">
                      <option value="estado">selecciona el tipo</option>
                      <option value="Aragua">Aragua</option>
                      <option value="Carabobo">Carabobo</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-12 col-md-12 mb-2">
                  <div class="form-group">
                    <label class="form-label" for="country">*Prioridad</label>
                    <select id="estado" class="select2 form-select">
                      <option value="estado">selecciona la prioridad</option>
                      <option value="Aragua">Aragua</option>
                      <option value="Carabobo">Carabobo</option>
                    </select>
                  </div>
                </div>
              </div>


              <div class="row">
                <div class="col-12 col-md-12 mb-2">
                  <div class="form-group">
                    <label class="form-label" for="country">*Departamento</label>
                    <select id="estado" class="select2 form-select">
                      <option value="estado">seleccione el departamento</option>
                      <option value="Aragua">Aragua</option>
                      <option value="Carabobo">Carabobo</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-md-7 mb-2">

              <div class="row">
                <div class="col-12 col-md-12 mb-2">
                  <div class="form-group">
                    <label for="direccion" class="form-label">*Descripción</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" rows="10"
                      placeholder="Indique su comunicatorio..."></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="Enviar" class="btn btn-primary">Enviar</button>
          <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Consulta de</span> Comunicatorios</h4>
