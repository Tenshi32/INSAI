<div class="modal fade" id="BaseDataModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-sm" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title fw-bold py-2" id="loginModalLabel">
          Inicio de sesión
        </h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="formLogin" method="POST" onsubmit="return false">
        <div class="modal-body">
          <div class="row">
            <div class="col-12 mb-3">
              <div class="form-group">
                <label for="login_usuario" class="form-label">Usuario</label>
                <input class="form-control" type="text" name="usuario" id="login_usuario" placeholder="usuario@example.com" autocomplete="username" />
              </div>
            </div>

            <div class="col-12 mb-3">
              <div class="form-group">
                <label for="login_password" class="form-label">Contraseña</label>
                <input class="form-control" type="password" name="password" id="login_password" placeholder="Contraseña" autocomplete="current-password" />
              </div>
            </div>

            <div id="importContainer" class="ml-2 mt-3"></div>
            
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="LoginBtn" class="btn btn-primary">Ingresar</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>

    </div>
  </div>
</div>

<div class="card">
  <h5 class="card-header">Table Basic</h5>

  <div class="ml-2 card-body">
    <div class="d-flex align-items-center">
      <div class="d-flex justify-content-center gap-4 w-100">
        <button type="button" class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#BaseDataModal">
          <i class='bx bx-arrow-out-down-square-half'></i> Exportar
        </button>

        <button type="button" id="btnImportar" class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#BaseDataModal">
          <i class='bx bx-arrow-in-up-square-half'></i> Importar
        </button>
      </div>

    </div>

  </div>
</div>


<script src="../../js/pages/database.js"></script>
