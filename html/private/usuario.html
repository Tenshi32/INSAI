<div class="modal fade" id="UsuarioModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title fw-bold py-2" id="exampleModalLabel1"> <span class="text-muted fw-light"></span>
          Creación de Usuario</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="formUsuario" method="POST" onsubmit="return false">

        <div class="modal-body">

          <div class="row">
            <span class="text-danger fw-light mb-3">Campos Obligatorio(*)</span>

            <div class="d-flex align-items-start align-items-sm-center gap-4">

              <img src="../../assets/img/avatars/1.png" alt="user-avatar" class="d-block rounded" height="100"
                width="100" id="uploadedAvatar" />
              <div class="button-wrapper">

                <label for="upload" class="btn btn-primary me-2 mb-4" tabindex="0">
                  <span class="d-none d-sm-block">Subir foto</span>
                  <input type="hidden" name="foto_ruta" id="foto_ruta" value="../../assets/img/avatars/1.png">
                  <i class="bx bx-upload d-block d-sm-none"></i>
                  <input type="file" id="upload" name="foto_archivo" class="account-file-input" hidden
                    accept="image/png, image/jpeg" />
                </label>

                <button type="button" id="resetear" class="btn btn-outline-secondary account-image-reset mb-4">
                  <i class="bx bx-reset d-block d-sm-none"></i>
                  <span class="d-none d-sm-block">Resetear</span>
                </button>

                <p class="text-muted mb-0">Formato permito JPG, PNG, la imagen no debe exceder de 5M</p>
              </div>
            </div>

            <input type="hidden" name="created" id="created">

            <div class="row">
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="cedula" class="form-label">cédula de identidad</label>
                  <input class="form-control" type="text" name="cedula" id="cedula" placeholder="V-13357514" />
                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="firstName" class="form-label">nombres</label>
                  <input class="form-control" type="text" id="firstName" name="firstName" placeholder="Freddy"
                    autofocus />
                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="lastName" class="form-label">apellidos</label>
                  <input class="form-control" type="text" id="lastName" name="lastName" placeholder="Miranda"
                    autofocus />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="email" class="form-label">Correo Electronico</label>
                  <input class="form-control" type="text" id="email" name="email" placeholder="hostpc01@example.com" />
                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label class="form-label" for="phoneNumber">número de teléfono</label>


                  <input type="text" id="numerocel" name="numerocel" class="form-control"
                    placeholder="0412 887.25.63" />

                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="fechan" class="form-label">fecha de nacimiento</label>
                  <input type="date" class="form-control" id="fechan" name="fechan" />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-12 col-md-6 mb-2">
                <div class="form-group">
                  <label for="direccion" class="form-label">dirección</label>
                  <input type="text" class="form-control" id="direccion" name="direccion"
                    placeholder="Indique su dirección" />
                </div>
              </div>
              <div class="col-12 col-md-6 mb-2">
                <div class="form-group">
                  <label for="direccion" class="form-label">profesion</label>
                  <input type="text" class="form-control" id="profesion" name="profesion"
                    placeholder="Indique su profesion" />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="direccion" class="form-label">Usuario</label>
                  <input type="text" class="form-control" id="usuario" name="usuario"
                    placeholder="Indique su dirección" />
                </div>
              </div>

              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="direccion" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="contraseña" name="contraseña"
                    placeholder="Indique su dirección" />
                </div>
              </div>

              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="direccion" class="form-label">Confirmar</label>
                  <input type="password" class="form-control" id="confirmarcontraseña" name="confirmarcontraseña"
                    placeholder="Indique su dirección" />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-12 col-md-6 mb-2">
                <div class="form-group">
                  <label class="form-label" for="departamento">*Nivel de Acceso</label>
                  <select id="nivel" name="nivel" class="select2 form-select">

                  </select>
                </div>
              </div>

              <div class="col-12 col-md-6 mb-2">
                <div class="form-group">
                  <label class="form-label" for="departamento">*Departamento</label>
                  <select id="departamento" name="departamento" class="select2 form-select">
                  </select>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label class="form-label" for="country">Pregunta 1</label>
                  <select id="pregunta1" name="pregunta1" class="select2 form-select">
                  </select>
                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="municipio" class="form-label">Pregunta 2</label>
                  <select id="pregunta2" name="pregunta2" class="select2 form-select">
                  </select>
                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="parroquia" class="form-label">Pregunta 3</label>
                  <select id="pregunta3" name="pregunta3" class="select2 form-select">
                  </select>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label class="form-label" for="country">Repuesta 1</label>
                  <input type="text" class="form-control" id="repuesta1" name="repuesta1" />
                  </select>
                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="municipio" class="form-label">Repuesta 2</label>
                  <input type="text" class="form-control" id="repuesta2" name="repuesta2" />
                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="parroquia" class="form-label">Repuesta 3</label>
                  <input type="text" class="form-control" id="repuesta3" name="repuesta3" />
                </div>
              </div>


            </div>

          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="Crear" class="btn btn-primary">Enviar</button>
          <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Consulta de</span> Usuarios</h4>

<!-- Basic Bootstrap Table -->
<div class="card">
  <h5 class="card-header">Table Basic</h5>

  <div class="ml-2 card-body">
    <div class="row">
      <div class="col-12 col-md-4 mb2">

        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#UsuarioModal"
          class="btn btn-primary me-2">Crear Usuario</button>

      </div>
      <div class="col-12 col-md-4 mb2"></div>

      <div class="col-12 col-md-4 mb2 d-flex align-items-center">
        <i class="bx bx-search fs-4 lh-0"></i>
        <input type="text" name="buscador" id="buscador" class="form-control border-0 shadow-none"
          placeholder="Buscador..." aria-label="Buscador..." />
      </div>
    </div>

    <div class="table-responsive text-nowrap">
      <table class="table">
        <thead>
          <tr>
            <th>Cedula</th>
            <th>Nombre</th>
            <th>Nivel</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody class="table-border-bottom-0" id="tablaUsuario">
          <tr>
            <td><i class="fab fa-angular fa-lg text-danger me-3"></i> <strong>Angular Project</strong></td>
            <td>Albert Cook</td>
            <td>
              <ul class="list-unstyled users-list m-0 avatar-group d-flex align-items-center">
                <li data-bs-toggle="tooltip" data-popup="tooltip-custom" data-bs-placement="top"
                  class="avatar avatar-xs pull-up" title="Lilian Fuller">
                  <img src="../../assets/img/avatars/5.png" alt="Avatar" class="rounded-circle" />
                </li>
              </ul>
            </td>
            <td><span class="badge bg-label-primary me-1">Active</span></td>
            <td>
              <div class="dropdown">
                <button type="button" class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown">
                  <i class="bx bx-dots-vertical-rounded"></i>
                </button>
                <div class="dropdown-menu">
                  <a class="dropdown-item" href="javascript:void(0);"><i class="bx bx-edit-alt me-1"></i> Edit</a>
                  <a class="dropdown-item" href="javascript:void(0);"><i class="bx bx-trash me-1"></i> Delete</a>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
