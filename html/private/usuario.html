<div class="modal fade" id="basicModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title fw-bold py-2" id="exampleModalLabel1"> <span class="text-muted fw-light"></span>
          Creación de Usuario</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="formUsuario" method="POST" onsubmit="return false">

        <div class="modal-body">

          <div class="row">
            <span class="text-danger fw-light mb-3">Campos Obligatorio(*)</span>

            <div class="d-flex align-items-start align-items-sm-center gap-4">

              <img src="../../assets/img/avatars/1.png" alt="user-avatar" class="d-block rounded" height="100"
                width="100" id="uploadedAvatar" />
              <div class="button-wrapper">

                <label for="upload" class="btn btn-primary me-2 mb-4" tabindex="0">
                  <span class="d-none d-sm-block">Subir foto</span>
                  <i class="bx bx-upload d-block d-sm-none"></i>
                  <input type="file" id="upload" class="account-file-input" hidden accept="image/png, image/jpeg" />
                </label>

                <button type="button" class="btn btn-outline-secondary account-image-reset mb-4">
                  <i class="bx bx-reset d-block d-sm-none"></i>
                  <span class="d-none d-sm-block">Resetear</span>
                </button>

                <p class="text-muted mb-0">Formato permito JPG, PNG, la imagen no debe exceder de 5M</p>
              </div>
            </div>

            <div class="row">
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="cedula" class="form-label">cédula de identidad</label>
                  <input class="form-control" type="text" name="cedula" id="cedula" placeholder="V-13357514" />
                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="firstName" class="form-label">nombres</label>
                  <input class="form-control" type="text" id="firstName" name="firstName" placeholder="Freddy"
                    autofocus />
                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <div class="form-group">
                  <label for="lastName" class="form-label">apellidos</label>
                  <input class="form-control" type="text" id="lastName" name="lastName" placeholder="Miranda"
                    autofocus />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-12 col-md-4 mb-2">
                <label for="email" class="form-label">Correo Electronico</label>
                <input class="form-control" type="text" id="email" name="email" placeholder="hostpc01@example.com" />

              </div>
              <div class="col-12 col-md-4 mb-2">
                <label class="form-label" for="phoneNumber">número de teléfono</label>
                <div class="input-group input-group-merge">
                  <span class="input-group-text"></span>
                  <input type="text" id="numerocel" name="numerocel" class="form-control"
                    placeholder="0412 887.25.63" />
                </div>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <label for="fechan" class="form-label">fecha de nacimiento</label>
                <input type="text" class="form-control" id="fechan" name="fechan" placeholder="12/12/1980" />
              </div>
            </div>
            <div class="row">
              <div class="col-12 col-md-12 mb-2">
                <label for="direccion" class="form-label">dirección</label>
                <input type="text" class="form-control" id="direccion" name="direccion"
                  placeholder="Indique su dirección" />
              </div>

              <div class="col-12 col-md-4 mb-2">
                <label class="form-label" for="country">estado</label>
                <select id="estado" class="select2 form-select">
                  <option value="estado">selecciona el estado</option>
                  <option value="Aragua">Aragua</option>
                  <option value="Carabobo">Carabobo</option>
                  <option value="Distrito Capital">Distrito Capital</option>
                  <option value="Apure">Apure</option>
                  <option value="Bolívar">Bolívar</option>
                  <option value="Amazonas">Amazonas</option>
                  <option value="Monagas">Monagas</option>
                  <option value="Mérida">Mérida</option>
                  <option value="Trujillo">Trujillo</option>
                  <option value="ITáchira">Táchira</option>
                  <option value="Portuguesa">Portuguesa</option>
                  <option value="Lara">Lara</option>
                  <option value="Falcón">Falcón</option>
                  <option value="Sucre">Sucre</option>
                  <option value="Nueva Esparta">Nueva Esparta</option>
                  <option value="Zulia">Zulia</option>
                  <option value="Delta Amacuro">Delta Amacuro</option>
                  <option value="Guárico">Guárico</option>
                  <option value="Barinas">Barinas</option>
                  <option value="Anzoátegui">Anzoátegui</option>
                  <option value="Cojedes">Cojedes</option>
                  <option value="Miranda">Miranda</option>
                  <option value="Vargas">Vargas</option>
                  <option value="Yaracuy">Yaracuy</option>
                </select>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <label for="municipio" class="form-label">municipio</label>
                <select id="municipio" class="select2 form-select">
                  <option value="">selecciona el municipio</option>
                  <option value="">Mario Briceño Irragory</option>
                  <option value="">Caña de Azúcar</option>
                  <option value="">Ejemplo1</option>
                  <option value="">Ejemplo2</option>
                </select>
              </div>
              <div class="col-12 col-md-4 mb-2">
                <label for="parroquia" class="form-label">parroquia</label>
                <select id="parroquia" class="select2 form-select">
                  <option value="">selecciona la parroquia</option>
                  <option value="">Santa Rosa</option>
                  <option value="">Tovar</option>
                  <option value="">Ejemplo1</option>
                  <option value="">Ejemplo2</option>
                </select>
              </div>


            </div>

          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="Enviar" class="btn btn-primary">Enviar</button>
          <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Consulta de</span> Usuarios</h4>

            <td>

                  <i class="bx bx-dots-vertical-rounded"></i>

                <div class="dropdown-menu">
                  <a class="dropdown-item" href="javascript:void(0);"><i class="bx bx-edit-alt me-1"></i> Edit</a>

  </div>
</div>
