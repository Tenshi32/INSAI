<div class="modal fade" id="ObjetivoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title fw-bold py-2">Creación de Objetivo (POA)</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="formObjetivo" method="POST" onsubmit="return false">
        <div class="modal-body">

          <input type="hidden" id="id_lineamiento" name="id_lineamiento"/>
          <input type="hidden" id="id_departamento" name="id_departamento"/>
          <input type="hidden" id="id_usuario" name="id_usuario"/>

          <div class="row">
            <div class="col-12 mb-3">
              <div class="form-group">
                <label for="proyecto" class="form-label">Nombre del Proyecto</label>
                <input type="text" class="form-control" id="proyecto" name="proyecto"
                  placeholder="Ej: Fortalecimiento de la vigilancia epidemiológica" required />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-12 col-md-6 mb-3">
              <div class="form-group">
                <label for="enfoque_estrategico" class="form-label">Enfoque Estratégico</label>
                <input type="text" class="form-control" id="enfoque_estrategico" name="enfoque_estrategico"
                  placeholder="Línea estratégica" />
              </div>
            </div>

            <div class="col-12 col-md-6 mb-3">
              <div class="form-group">
                <label for="sector" class="form-label">Sector</label>
                <input type="text" class="form-control" id="sector" name="sector"
                  placeholder="Ej: Agrícola / Pecuario" />
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-12 mb-3">
              <div class="form-group">
                <label for="objetivos" class="form-label">Objetivo Específico</label>
                <textarea class="form-control" id="objetivos" name="objetivos" rows="3"
                  placeholder="Describa el objetivo..."></textarea>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-12 col-md-6 mb-2">
              <div class="form-group">
                <label for="actividad" class="form-label">Actividad Principal</label>
                <input type="text" class="form-control" id="actividad" name="actividad"
                  placeholder="Acción a ejecutar" />
              </div>
            </div>

            <div class="col-12 col-md-6 mb-2">
              <div class="form-group">
                <label class="form-label" for="tipo_poa">*Tipo de Poa </label>
                <select id="tipo_poa" name="tipo_poa" class="select2 form-select">
                </select>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="Crear" class="btn btn-primary">Guardar Objetivo</button>
          <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Consulta de</span> Objetivos</h4>

<div class="card mt-4">
  <h5 class="card-header">Listado de Objetivos POA - INSAI</h5>
  <div class="card-body">
    <div class="row">
      <div class="col-12 col-md-4 mb2">

        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#ObjetivoModal"
          class="btn btn-primary me-2">Crear Objetivo</button>

      </div>
      <div class="col-12 col-md-4 mb2"></div>

      <div class="col-12 col-md-4 mb2 d-flex align-items-center">
        <i class="bx bx-search fs-4 lh-0"></i>
        <input type="text" name="buscador" id="buscador" class="form-control border-0 shadow-none"
          placeholder="Buscador..." aria-label="Buscador..." />
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Proyecto</th>
            <th>Sector</th>
            <th>Objetivo</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaPOA">
        </tbody>
      </table>
    </div>
  </div>
</div>


<script src="../../assets/js/form-basic-inputs.js"></script>
<script src="../../js/pages/objetivo.js"></script>
