<h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Perfil del Usuario</h4>

<!-- Basic Bootstrap Table -->


<div class="row">
  <div class="col-md-12">
    <div class="card mb-4">
      <h5 class="card-header">Detalles del Perfil</h5>
      <div class="card-body">
        <div class="d-flex align-items-start align-items-sm-center gap-4">
          <img src="../../assets/img/avatars/1.png" alt="user-avatar" class="d-block rounded" height="100" width="100"
            id="uploadedAvatar" />
          <div class="button-wrapper">
            <h4 class="mb-1" id="display_full_name">Cargando...</h4>
            <p class="text-muted mb-0" id="display_rol">Rol de usuario</p>
            <span class="badge bg-label-primary mt-2" id="display_depto">Departamento</span>
          </div>
        </div>
      </div>
      <hr class="my-0" />
      <div class="card-body">
        <form id="formAccountSettings" method="POST" onsubmit="return false">
          <div class="row">
            <div class="mb-3 col-md-6">
              <label for="usuario" class="form-label">Nombre de Usuario</label>
              <input class="form-control" type="text" id="usuario" name="usuario" readonly />
            </div>
            <div class="mb-3 col-md-6">
              <label for="cedula" class="form-label">Cédula de Identidad</label>
              <input class="form-control" type="text" name="cedula" id="cedula" />
            </div>
            <div class="mb-3 col-md-6">
              <label for="firstName" class="form-label">Nombres</label>
              <input class="form-control" type="text" id="firstName" name="firstName" />
            </div>
            <div class="mb-3 col-md-6">
              <label for="lastName" class="form-label">Apellidos</label>
              <input class="form-control" type="text" id="lastName" name="lastName" />
            </div>
            <div class="mb-3 col-md-6">
              <label for="email" class="form-label">E-mail</label>
              <input class="form-control" type="text" id="email" name="email" />
            </div>
            <div class="mb-3 col-md-6">
              <label class="form-label" for="numerocel">Teléfono</label>
              <div class="input-group input-group-merge">
                <span class="input-group-text">VEN (+58)</span>
                <input type="text" id="numerocel" name="numerocel" class="form-control" />
              </div>
            </div>
            <div class="mb-3 col-md-6">
              <label for="fechan" class="form-label">Fecha de Nacimiento</label>
              <input type="date" class="form-control" id="fechan" name="fechan" />
            </div>
            <div class="mb-3 col-md-12">
              <label for="direccion" class="form-label">Dirección</label>
              <input type="text" class="form-control" id="direccion" name="direccion" />
            </div>
          </div>
          <div class="mt-2">
            <button type="submit" class="btn btn-primary me-2">Guardar cambios</button>
            <button type="reset" class="btn btn-outline-secondary">Descartar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>



<!-- Js de Departamento -->

<script src="../../js/pages/perfil.js"></script>
