    <!-- Content -->
    <div class="col-md-5">
      <div class="container-xxl">
        <div class="authentication-wrapper authentication-basic container-p-y">
          <!-- REGISTRO -->
          <div class="card">
            <div class="card-body">
              <!-- Logo -->
              <div class="app-brand justify-content-center">
                <a href="index.html" class="app-brand-link gap-2">
                  <span class="app-brand-logo demo">
                  </span>
                </a>
              </div>
              <!--LOGO -->
              <center><img class="mb-2" src="/assets/img/logos/logo-indinsai.png" width="55%">
              <h4 class="mb-3"><small>SISTEMA AUTOMATIZADO POA</small></h4>
              <h6 class="mb-2"> Por favor inicia sesión en tu cuenta</h6></center>
              <form id="formAuthentication" class="mb-3" action="index.html" method="POST">
                <div class="mb-3">
                  <label for="email" class="form-label">nombre de usuario/e-mail</label>
                  <input type="text" class="form-control" id="email" name="email-username"
                    placeholder= "ingrese su usuario o su correo electronico" autofocus />
                </div>
                <div class="mb-3 form-password-toggle">
                  <div class="d-flex justify-content-between">
                    <label class="form-label" for="password">Password</label>
                    <a class="nav-link" href="/html/auth-forgot-password-basic.html">
                      <h6>¿Haz olvidado tu contraseña?</h6>
                    </a>
                  </div>
                  <div class="input-group input-group-merge">
                    <input type="password" id="password" class="form-control" name="password"
                     placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                     aria-describedby="password" />
                    <span class="input-group-text cursor-pointer"><i class="bx bx-hide"></i></span>
                  </div>
                </div>
                <div class="mb-4">
                </div>
                <div class="mb-4">
                  <button class="btn btn-primary d-grid w-100" type="submit">Iniciar sesión</button>
                </div>
              </form>
            </div>
          </div>
