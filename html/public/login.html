<body class="bg-light">

  <div class="background-image">
    <link rel="stylesheet" href="../../assets/css/stylos.css" />
    <img id="background-image" src="../../assets/img/backgrounds/fondo.png" width="100%" height="50%">
  </div>
  
  <div class="row">
    <div class="col-md-7">
      <div class="row container-membrete">
        <img src="../../assets/img/logos/gobierno.png">
        <img src="../../assets/img/logos/logo-ministerio.png">
        <img src="../../assets/img/logos/logo-insai2.png">

      </div>
    </div>

<!-- CONTENIDO -->    

    <div class="col-md-5">
      <div class="container-xxl">
        <div class="authentication-wrapper authentication-basic container-p-y">
 
<!-- REGISTRO -->
 
          <div class="card">
            <div class="card-body">
            
  <!--LOGO -->
              <center><img class="mb-2" src="../../assets/img/logos/logo-indinsai.png" width="55%">
                <h4 class="mb-3"><small>SISTEMA AUTOMATIZADO POA</small></h4>
                <h6 class="mb-2"> Por favor inicia sesión en tu cuenta</h6>
              </center>
              <form id="formAuthentication" class="mb-3">
                <div class="mb-3">
                  <label for="email" class="form-label text-uppercase small fw-bold">Usuario o Correo</label>
                  <input type="text" class="form-control" id="email_username" name="email_username"
                    placeholder="Ingrese su credencial" autofocus />
                </div>
                <div class="mb-3 form-password-toggle">
                  <div class="d-flex justify-content-between">
                    <label class="form-label text-uppercase small fw-bold" for="password">Contraseña</label>
                    <a href="/html/auth-forgot-password-basic.html">
                      <small>¿Olvidó su contraseña?</small>
                    </a>
                  </div>
                  <div class="input-group input-group-merge">
                    <input type="password" id="password" class="form-control" name="password"
                      placeholder="············" />
                    <span class="input-group-text cursor-pointer"><i class="bx bx-hide"></i></span>
                  </div>
                </div>
                <div class="mb-4">
                  <button id="IniciarSession" class="btn btn-success d-grid w-100 shadow-sm" type="button">
                    <i class='bx bx-log-in-circle me-2'></i> INICIAR SESIÓN
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
 
  <!-- BUILD.JS assets/vendor/js/core.js -->

  <script src="../../assets/vendor/libs/jquery/jquery.js"></script>
  <script src="../../assets/vendor/libs/popper/popper.js"></script>

  <script src="../../libs/jquery-validation/jquery.validate.min.js"></script>

  <script src="../../libs/sweetalert/sweetalert2.js"></script>
  <script src="../../libs/sweetalert/sweetalert2.all.min.js"></script>
  <script src="../../js/functions.js"></script>
  <script src="../../js/pages/session.js"></script>
